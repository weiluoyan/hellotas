journeyStep3RotaryTitle: "Rotary Clubs of Tasmania"
journeyStep3RotaryText: "Rotary is a worldwide network of community volunteers, and Tasmania's District 9830 has 42 clubs, from Hobart and Kingston to Launceston, Devonport and Burnie. Members run local service projects, fundraisers and youth programs, and welcome students who can help with websites, IT support and events while meeting local professionals. Aged 18–30? Rotaract clubs are Rotary for young adults, with service projects, leadership training and chances to volunteer overseas."
journeyStep3RotaryWhen: "Most clubs meet weekly over breakfast, lunch or dinner; the Rotary Club of Hobart meets Thursdays, 1:00 – 2:00 PM"
journeyStep3RotaryWhere: "42 clubs around Tasmania (full list below); the Hobart club meets at Hotel Grand Chancellor, 1 Davey Street"
journeyStep3RotaryWho: "Students and new members welcome — contact a club near you first; Rotaract is for ages 18–30"
