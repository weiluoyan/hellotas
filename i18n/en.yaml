# Journey — Step 1 (arrival)
journeyBackToJourney: "← Journey"
journeyStep1Eyebrow: "Journey · Step 1"
journeyStep1Title: "Start your life here"
journeyStep1Lead: "Get your survival basics sorted first. A stable foundation makes everything else possible."

journeyStep1Priority1Title: "Survival Income"
journeyStep1Priority1Tag: "Casual work"
journeyStep1Priority1Text: "You need money to survive while you study, so start looking for casual work early."
journeyStep1Priority1Sub: "Apply for a free Tax File Number (TFN) online via the ATO, keep a simple one-page resume, and check the UTAS Careers portal and job boards. Check your visa work-hour limit on VEVO first, and <strong>avoid cash-in-hand jobs below minimum wage</strong> — they can risk your visa."
journeyStep1Priority1ImageAlt: "Student working a casual café job in Hobart"

journeyStep1Priority2Title: "Accommodation"
journeyStep1Priority2Tag: "Live"
journeyStep1Priority2Text: "Secure your place early. UTAS housing fills up fast."
journeyStep1Priority2Sub: "Apply for UTAS residences first, then use <strong>Flatmates</strong> or <strong>Facebook Marketplace</strong> to find a share house. Always inspect (in person or by video call) before paying anything — rental scams often target students booking from overseas."
journeyStep1Priority2ImageAlt: "A share house with a garden and mountain backdrop in Hobart"

journeyStep1BasicsTitle: "The Daily Basics"

