journeyStep2Lead: "Friendly places to meet people and practise your English at your own pace."
journeyStep2ShareLabel: "Pass this page on to someone who is still settling in."

journeyStep2WhyTitle: "You don't need perfect English to start. You need a safe place to practice."
journeyStep2WhyText: "The activities below are free or very low cost, welcoming, and made for people exactly where you are now. Pick one that fits your week — showing up regularly matters more than speaking perfectly."

