journeyStep1BasicTransportTitle: "Move & Transport"
journeyStep1Transport1: "Metro Tasmania buses + real-time app"
journeyStep1Transport2: "Greencard — student concession fares"
journeyStep1Transport3: "Carry your student ID for concessions"
journeyStep1TransportImageAlt: "City bus at a bus stop with waiting passengers"

journeyStep1BasicConnectTitle: "Connect & Bank"
journeyStep1Connect1: "Prepaid SIM — Telstra, Optus, Vodafone or budget brands like Amaysim"
journeyStep1Connect2: "Open a CommBank / ANZ student account (you can start online)"
journeyStep1Connect3: "Stay on prepaid until you have steady income"
journeyStep1ConnectImageAlt: "Phone with SIM card and bank card for setting up accounts"

journeyStep1BasicSafetyTitle: "Safety First"
journeyStep1Safety1: "Emergency: 000 (police, fire, ambulance)"
journeyStep1Safety2: "UTAS SafeZone app — campus security"
journeyStep1Safety3: "Non-urgent police assistance: 131 444"
journeyStep1SafetyImageAlt: "Safety shield and phone for emergency contacts"

journeyStep1ChecklistTitle: "Your Arrival Checklist"
journeyStep1ChecklistLead: "Tick these off to know you are ready for Step 2."
