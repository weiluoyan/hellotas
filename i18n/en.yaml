journeyStep2RedCrossTag: "VOLUNTEER"
journeyStep2RedCrossText: "Visit an older community member for a friendly chat over tea or a card game. A gentle, rewarding way to practise English and hear local stories — Red Cross trains and supports you, and covers your police check."
