journeyStep3GccTitle: "Glenorchy Community Care"
journeyStep3GccText: "A food relief centre run by the Churches of Glenorchy. Every Thursday morning volunteers set up the church hall, sort donated food onto the tables and pack a full trolley for each household, with bread, milk, fruit and vegetables, meat and pantry staples. Low-income households from any area are welcome: bring ID and pay a $30 handling fee for a trolley of food (they don't give out vouchers or emergency food). You can also help with community events or offer your IT skills to this local non-profit, and volunteers can gain certification."
journeyStep3GccWhen: "Food access: Thursdays 9:30 – 11:00 AM; volunteering is flexible (check website)"
journeyStep3GccWhere: "Glenorchy Uniting Church Hall, 21 Kensington Street, Glenorchy (across the pedestrian crossing from Glenorchy Primary School; follow the Entrance signs)"
journeyStep3GccWho: "Volunteers: all students (certification available) · Food: low-income households from any area"
