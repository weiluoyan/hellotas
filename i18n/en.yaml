journeyStep2PeopleLibraries1: "Launceston Library — English conversation classes, call (03) 6777 2446"
journeyStep2PeopleLibraries2: "Kingston Library — friendly beginner group, Thursdays"
journeyStep2PeopleLibraries3: "Rosny Library — drop-in conversation group, Tuesdays"

journeyStep2TipsTitle: "Tips from someone who has been there"
journeyStep2TipsLead: "Habits that helped a Chinese international student — who started at the UTAS Language Centre — make English feel normal."
journeyStep2Tip1Title: "Your English is better than you think"
journeyStep2Tip1Text: "Exams train reading and listening, so speaking lags behind — that is normal for almost everyone. Speaking improves through repetition, not more grammar study."
journeyStep2Tip2Title: "Practise in tiny moments"
journeyStep2Tip2Text: "Say one extra sentence to the barista, the bus driver or the cashier each day. After a month, small talk stops being scary."
journeyStep2Tip3Title: "One regular group beats random chats"
journeyStep2Tip3Text: "Pick a weekly group and keep going back. Familiar faces and repeated topics make talking much easier than meeting strangers every time."
journeyStep2Tip4Title: "Keep your circle, expand your voice"
journeyStep2Tip4Text: "It's fine to find activities through Chinese-speaking friends — just agree to speak English once you're there. And don't worry about your accent: Hobart locals are patient and used to many accents."

journeyStep2NextTitle: "Ready to connect with your industry?"
