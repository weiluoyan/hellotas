# Journey — Step 1 (arrival)
journeyBackToJourney: "← Journey"
journeyStep1Eyebrow: "Journey · Step 1"
journeyStep1Title: "Start your life here"
journeyStep1Lead: "Get your survival basics sorted first. A stable foundation makes everything else possible."

journeyStep1Priority1Title: "Survival Income"
journeyStep1Priority1Tag: "Casual work"
journeyStep1FirstTitle: "Your first 2 weeks"
journeyStep1First1Title: "Get a SIM"
journeyStep1First1Text: "You need an Australian number for almost everything."
journeyStep1First2Title: "Get an address"
journeyStep1First2Text: "Your TFN letter will be posted here."
journeyStep1First3Title: "Open a bank account"
journeyStep1First3Text: "Bring your passport. You can start online."
journeyStep1First4Title: "Apply for your TFN"
journeyStep1First4Text: "Free, online at the ATO. Arrives by post in about 2–4 weeks."
journeyStep1First5Title: "Ride the bus free"
journeyStep1First5Text: "Metro buses are free until 30 June 2027. No card needed."
journeyStep1First6Title: "Start job hunting"
journeyStep1First6Text: "Don't wait for your TFN to apply."

journeyStep1Priority1Text: "Start job hunting from day one."
journeyStep1IncomeResumeTitle: "Tailor your resume"
journeyStep1IncomeResumeText: "Make one for each job type: customer service, hospitality or kitchen. Later, look for jobs in your field."
journeyStep1IncomeApplyTitle: "Apply online, then walk in"
journeyStep1IncomeApplyText: "Apply online, then drop in the next day with the same resume. Also try cafés, supermarkets and service stations."
journeyStep1IncomeDeliveryTitle: "Deliver while you wait"
journeyStep1IncomeDeliveryText: "With your TFN, get a free <a href='https://www.abr.gov.au/business-super-funds-charities/applying-abn' target='_blank' rel='noopener'>ABN</a> and sign up for DoorDash or Uber Eats. Quick cash, but it doesn't count as job experience."
journeyStep1IncomeLinksLabel: "Find jobs on:"
journeyStep1IncomeWarn1: "<strong>Check your work-hour limit on <a href='https://immi.homeaffairs.gov.au/visas/already-have-a-visa/check-visa-details-and-conditions/check-conditions-online' target='_blank' rel='noopener'>VEVO</a></strong> — delivery hours count too."
journeyStep1IncomeWarn2: "<strong>Avoid cash-in-hand jobs</strong> — often underpaid, untaxed and a risk to your visa. <a href='https://www.fairwork.gov.au/tools-and-resources/fact-sheets/rights-and-obligations/international-students' target='_blank' rel='noopener'>Know your rights ↗</a>"
journeyStep1Priority1ImageAlt: "University of Tasmania students around a table in a café-style kitchen"

journeyStep1Priority2Title: "Accommodation"
journeyStep1Priority2Tag: "Live"
journeyStep1Priority2Text: "Secure your place early — good rooms near campus go fast."
journeyStep1Priority2ImageAlt: "Aerial view of Sandy Bay homes near the university and the Derwent River"
journeyStep1HomeSearchTitle: "Search online"
journeyStep1HomeSearchText: "Browse rooms and share houses on Flatmates and Facebook Marketplace. Start before you arrive."
journeyStep1HomeGroupsTitle: "Join local groups"
journeyStep1HomeGroupsText: "Join Hobart rental and share-house groups on Facebook. Many rooms are only posted there."
journeyStep1HomeAskTitle: "Ask other students"
journeyStep1HomeAskText: "Ask UTAS students where they live. They often know of rooms coming up in their share houses."
journeyStep1HomeLinksLabel: "Find rooms on:"
journeyStep1HomeWarn1: "<strong>Inspect before you pay</strong> — in person or by video call. Rental scams target students booking from overseas."
journeyStep1HomeWarn2: "<strong>Pay your bond through MyBond</strong>, never to the owner directly. <a href='https://www.cbos.tas.gov.au/topics/housing/renting/bonds/paying-bond' target='_blank' rel='noopener'>How bonds work ↗</a>"

journeyStep1BasicsTitle: "The Daily Basics"

journeyStep1BasicEatTitle: "Eat & Groceries"
journeyStep1Eat1: "<a href='https://www.coles.com.au/find-stores' target='_blank' rel='noopener'>Coles</a> / <a href='https://www.woolworths.com.au/shop/storelocator' target='_blank' rel='noopener'>Woolworths</a> supermarkets"
journeyStep1Eat2: "<a href='https://tusa.org.au/food-hub/' target='_blank' rel='noopener'>TUSA Food Hub</a> — free fruit, veg and bread (bring your UTAS ID)"
journeyStep1Eat3: "Asian grocers in North Hobart"
journeyStep1EatImageAlt: "Fresh fruit and vegetables in crates at the student Food Hub"

journeyStep1BasicTransportTitle: "Move & Transport"
journeyStep1Transport1: "Metro buses are <strong>free until 30 June 2027</strong> — no card needed"
journeyStep1Transport2: "Check bus times on the Metro Tasmania real-time app"
journeyStep1Transport3: "Learn to drive before you arrive — buses can be slow and infrequent"
journeyStep1TransportImageAlt: "A Metro Tasmania bus at a bus stop"

journeyStep1BasicConnectTitle: "Connect & Bank"
journeyStep1Connect1: "Prepaid SIM — Telstra, Optus, Vodafone or budget brands like Amaysim"
journeyStep1Connect2: "Open a <a href='https://www.commbank.com.au/moving-to-australia/study-in-australia.html' target='_blank' rel='noopener'>CommBank</a> account online, then visit the <a href='https://www.commbank.com.au/personal/locate-us/tas/hobart/067000.html' target='_blank' rel='noopener'>Hobart branch</a> with your passport"
journeyStep1Connect3: "Stay on prepaid until you have steady income"
journeyStep1ConnectImageAlt: "International students smiling around a laptop"

journeyStep1BasicSafetyTitle: "Safety First"
journeyStep1Safety1: "Emergency: 000 (police, fire, ambulance)"
journeyStep1Safety2: "UTAS <a href='https://www.utas.edu.au/about/safety-security-and-wellbeing' target='_blank' rel='noopener'>SafeZone app</a> — campus security"
journeyStep1Safety3: "Non-urgent police assistance: 131 444"
journeyStep1SafetyImageAlt: "University of Tasmania students at orientation, Sandy Bay"

journeyStep1ChecklistTitle: "Your Arrival Checklist"
journeyStep1ChecklistLead: "Tick these off to know you are ready for Step 2."
journeyStep1Checklist1: "I have a SIM card, an address and a bank account."
journeyStep1Checklist2: "I have applied for my Tax File Number (TFN)."
journeyStep1Checklist3: "My resumes are ready and I'm on Seek, Indeed and Jora."
journeyStep1Checklist4: "I have checked my work-hour limit on VEVO."
journeyStep1Checklist5: "I have secure accommodation (or a temporary place to stay)."
journeyStep1Checklist6: "I know who to call in an emergency (000 and campus security)."

journeyStep1MissedTitle: "Missed Orientation?"
journeyStep1MissedText: "It's okay — many students arrive late. Focus on the checklist above first. You can catch up on clubs, library tours and campus life in Step 3."

