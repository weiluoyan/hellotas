journeyStep2MathersTag: "LOW-COST LUNCH · WEEKDAYS"
journeyStep2MathersText: "A warm City of Hobart community space next to the State Library. Drop in for an affordable café lunch, stay for activities from board games to ukulele, or help visitors find their way as a Meet & Greet volunteer."
