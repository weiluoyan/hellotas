journeyStep3FoodHubTitle: "TUSA Food Hub"
journeyStep3FoodHubText: "Run by the Tasmania University Student Association (TUSA), the Food Hub is a free and low-cost grocery service for UTAS students on every campus. Book a ticket on Rubric each week: the free ticket covers fruit and vegetables, bread, frozen food and the free items table, and the $5 or $8 bundles add 5 or 8 pantry items. Student volunteers run each session, scanning tickets and helping students find what they need, and the Food Hub also hosts free cooking classes and community lunches. Sign up on TUSA's volunteering page to help out."
journeyStep3FoodHubWhen: "Sandy Bay: Tuesdays & Thursdays 11 AM – 2 PM · Hobart City: Wednesdays 1 – 3 PM (tickets open at 6 PM the Friday before)"
journeyStep3FoodHubWhere: "Level 1, Social Sciences Building, Sandy Bay campus · Peter Underwood Centre, Hobart City (also at Inveresk, Cradle Coast and Rozelle)"
journeyStep3FoodHubWho: "All UTAS students: bring your student ID and a bag; one ticket per week"
