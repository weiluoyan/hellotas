journeyStep3FoodHubTitle: "TUSA Food Hub"
journeyStep3FoodHubText: "Tasmania University Student Association (TUSA) द्वारा सञ्चालित Food Hub सबै क्याम्पसका UTAS विद्यार्थीका लागि नि:शुल्क र सस्तो किराना सेवा हो। हरेक हप्ता Rubric मा टिकट बुक गर्नुहोस्: नि:शुल्क टिकटमा फलफूल र तरकारी, पाउरोटी, फ्रोजन खाना र नि:शुल्क सामानको टेबल पर्छ, र $५ वा $८ को बन्डलमा थप ५ वा ८ वटा पेन्ट्री सामान आउँछ। हरेक सत्र विद्यार्थी स्वयंसेवकहरूले चलाउँछन्, टिकट स्क्यान गर्छन् र विद्यार्थीलाई चाहिएको सामान खोज्न मद्दत गर्छन्; Food Hub ले नि:शुल्क खाना पकाउने कक्षा र सामुदायिक लन्च पनि आयोजना गर्छ। मद्दत गर्न TUSA को स्वयंसेवा पेजमा दर्ता गर्नुहोस्।"
