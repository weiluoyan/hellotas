# Journey — Step 2 (build your voice)
journeyStep2Title: "समुदायसँग आफ्नो आवाज बनाउनुहोस्"
journeyStep2Lead: "मानिसहरू भेट्न र आफ्नै गतिमा अंग्रेजी अभ्यास गर्न मैत्रीपूर्ण ठाउँहरू।"
journeyStep2ShareLabel: "अझै बानी पर्दै गरेका कसैलाई यो पृष्ठ पठाइदिनुहोस्।"

journeyStep2WhyTitle: "सुरु गर्न उत्तम अंग्रेजी चाहिँदैन। अभ्यास गर्न सुरक्षित ठाउँ चाहिन्छ।"
journeyStep2WhyText: "तलका गतिविधि निःशुल्क वा निकै सस्ता, स्वागतयोग्य र अहिलेको तपाईंका लागि बनाइएका हुन्। हप्तामा मिल्ने एउटा छान्नुहोस् — पूर्ण रूपमा बोल्नुभन्दा नियमित रूपमा आउनु महत्त्वपूर्ण छ।"

journeyStep2WhenLabel: "कहिले:"
journeyStep2WhereLabel: "कहाँ:"
journeyStep2LinkLabel: "आधिकारिक लिंक"

journeyStep2Section1Title: "कुराकानी र समुदाय"
journeyStep2Section3Title: "आफ्ना मानिस खोज्नुहोस्"

journeyStep2LingoTitle: "UTAS Language Centre"
journeyStep2LingoText: "University of Tasmania English Language Centre मा अंग्रेजी पढ्नुहोस् — डिग्रीका लागि Direct Entry / EAP मार्ग, र अध्ययन, करियर वा यात्राका लागि General English। मैत्रीपूर्ण शिक्षकहरू, ऐतिहासिक Phillip Smith Centre मा आधुनिक सुविधाहरू, र स्वागतयोग्य समुदाय।"
