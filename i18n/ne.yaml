# Fun & Fitness page
funFitnessFunTitle: "केही रमाइलो"
funFitnessFunLead: "कक्षापछि आफ्नै केही बनाउनुहोस्: तस्मानियामै बनेको Yarn Spinner मा आफ्नो गेमको कथा लेखेर खेल्नुहोस्, जुनसुकै क्याम्पसबाट ब्राउजरमा निःशुल्क, र अनलाइन वा भेटघाटमा स्थानीय गेम बनाउनेहरूलाई भेट्नुहोस्।"
funFitnessFitTitle: "केही फिट"
funFitnessFitLead: "सक्रिय रहनु पढाइको तनाव कम गर्ने, साथी बनाउने र घरजस्तो महसुस गर्ने उत्कृष्ट तरिकामध्ये एक हो। UniGym का जिम Hobart, Launceston र Burnie क्याम्पसमा छन्, तीनै क्याम्पस नजिक हरेक शनिबार निःशुल्क parkrun हुन्छ, र Hobart का स्क्वास क्लबहरूले नयाँ खेलाडीलाई स्वागत गर्छन्।"
funFitnessShareLabel: "कक्षापछि केही गर्न खोजिरहेका सहपाठीलाई यो पृष्ठ पठाइदिनुहोस्।"
