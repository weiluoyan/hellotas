# Journey — Step 1 (arrival)
journeyBackToJourney: "← यात्रा"
journeyStep1Eyebrow: "यात्रा · चरण १"
journeyStep1Title: "यहाँबाट जीवन सुरु गर्नुहोस्"
journeyStep1Lead: "पहिले जीविकाका आधारभूत कुरा मिलाउनुहोस्। स्थिर जग भएपछि अरू सबै सम्भव हुन्छ।"

journeyStep1Priority1Title: "जीविकाको आम्दानी"
journeyStep1Priority1Tag: "अनियमित काम"
journeyStep1FirstTitle: "तपाईंका पहिला २ हप्ता"
journeyStep1First1Title: "SIM कार्ड लिनुहोस्"
journeyStep1First1Text: "प्रायः सबै कुराका लागि अस्ट्रेलियाली नम्बर चाहिन्छ।"
journeyStep1First2Title: "ठेगाना प्राप्त गर्नुहोस्"
journeyStep1First2Text: "तपाईंको TFN पत्र यहाँ पठाइनेछ।"
journeyStep1First3Title: "बैंक खाता खोल्नुहोस्"
journeyStep1First3Text: "पासपोर्ट ल्याउनुहोस्। अनलाइनबाट सुरु गर्न सकिन्छ।"
journeyStep1First4Title: "TFN का लागि आवेदन दिनुहोस्"
journeyStep1First4Text: "ATO मा निःशुल्क अनलाइन। करिब २–४ हप्तामा हुलाकबाट आउँछ।"
journeyStep1First5Title: "बस निःशुल्क चढ्नुहोस्"
journeyStep1First5Text: "Metro बसहरू ३० जुन २०२७ सम्म निःशुल्क छन्। कार्ड चाहिँदैन।"
journeyStep1First6Title: "जागिर खोज्न थाल्नुहोस्"
journeyStep1First6Text: "TFN आउने पर्खाइमा आवेदन नरोक्नुहोस्।"

journeyStep1Priority1Text: "पहिलो दिनदेखि नै जागिर खोज्न थाल्नुहोस्।"
journeyStep1IncomeResumeTitle: "रिज्युम मिलाउनुहोस्"
journeyStep1IncomeResumeText: "प्रत्येक प्रकारको जागिरका लागि एउटा बनाउनुहोस्: ग्राहक सेवा, आतिथ्य वा भान्सा। पछि आफ्नो क्षेत्रका जागिर खोज्नुहोस्।"
journeyStep1IncomeApplyTitle: "अनलाइन आवेदन दिनुहोस्, अनि प्रत्यक्ष जानुहोस्"
journeyStep1IncomeApplyText: "अनलाइन आवेदन दिएपछि भोलिपल्ट उही रिज्युम लिएर जानुहोस्। क्याफे, सुपरमार्केट र सर्भिस स्टेशन पनि प्रयास गर्नुहोस्।"
journeyStep1IncomeDeliveryTitle: "पर्खाइमा डेलिभरी गर्नुहोस्"
journeyStep1IncomeDeliveryText: "TFN आएपछि निःशुल्क <a href='https://www.abr.gov.au/business-super-funds-charities/applying-abn' target='_blank' rel='noopener'>ABN</a> लिनुहोस् र DoorDash वा Uber Eats मा साइन अप गर्नुहोस्। छिटो नगद मिल्छ, तर यसलाई जागिर अनुभव मानिँदैन।"
journeyStep1IncomeLinksLabel: "जागिर खोज्नुहोस्:"
journeyStep1IncomeWarn1: "<strong><a href='https://immi.homeaffairs.gov.au/visas/already-have-a-visa/check-visa-details-and-conditions/check-conditions-online' target='_blank' rel='noopener'>VEVO</a> मा आफ्नो काम-घण्टा सीमा जाँच गर्नुहोस्</strong> — डेलिभरी घण्टा पनि गनिन्छ।"
