# Homepage — career path (issue #55; replaces habits + homepage graduate stories)
homeCareerTitle: "तपाईंको सपनाको करियरको बाटो"
homeCareerLead: "यो केवल परीक्षा पास गर्ने कुरा होइन। यो सही आधार क्रमशः निर्माण गर्ने कुरा हो।"
homeCareerCard1Title: "आफ्नो अङ्ग्रेजी मजबुत बनाउनुहोस्"
homeCareerCard1Text: "अङ्ग्रेजी नै जग हो। पूर्ण नभएसम्म कुर्नु पर्दैन। वास्तविक कुराकानी र स्थानीय गतिविधिमार्फत दैनिक बनाउनुहोस्।"
homeCareerCard2Title: "समुदायमा डुब्नुहोस्"
homeCareerCard2Text: "आफ्नो सहज क्षेत्रबाट बाहिर निस्कनुहोस्। स्थानीय संस्कृति सिक्नुहोस्, साझा विषय खोज्नुहोस्, र स्थानीयसँग साँचो सम्बन्ध बनाउनुहोस्।"
homeCareerCard3Title: "क्लब र ICT कार्यक्रममा जोडिनुहोस्"
homeCareerCard3Text: "सीपलाई वास्तविक समस्या समाधानमा लगाउनुहोस्। सञ्जाल बनाउनुहोस् र कक्षाबाहिर उद्योग कसरी चल्छ सिक्नुहोस्।"
homeCareerCard4Title: "विश्वसनीय सिफारिस सुरक्षित गर्नुहोस्"
homeCareerCard4Text: "अस्ट्रेलियामा जागिर प्रायः सिफारिसमा भर पर्छ। क्लब र कार्यक्रममा भेटिएका मानिसहरू नै तपाईंको पक्षमा बोल्ने हुन्।"
homeCareerCard5Title: "आफ्नो सपना पूरा गर्नुहोस्"
homeCareerCard5Text: "मजबुत अङ्ग्रेजी, स्थानीय सांस्कृतिक बुझाइ, वास्तविक अनुभव र बलियो सिफारिस मिलाउनुहोस्। तस्मानियामा सफलता भाग्य होइन — यी कदम चाल्दा आउने स्वाभाविक परिणाम हो।"

