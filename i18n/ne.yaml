journeyStep1HomeAskText: "UTAS विद्यार्थीलाई कहाँ बस्छन् भनेर सोध्नुहोस्। उनीहरू प्रायः आफ्नो सेयर हाउसमा खाली हुने कोठा थाहा पाउँछन्।"
