journeyStep3GccTitle: "Glenorchy Community Care"
journeyStep3GccText: "Churches of Glenorchy द्वारा सञ्चालित खाद्य राहत केन्द्र। हरेक बिहीबार बिहान स्वयंसेवकहरूले चर्च हल तयार पार्छन्, दान आएको खाना टेबलमा मिलाउँछन् र हरेक घरपरिवारका लागि एक ट्रली भरि खाना प्याक गर्छन्: पाउरोटी, दूध, फलफूल र तरकारी, मासु र दैनिक किराना सामान। जुनसुकै क्षेत्रका कम आम्दानी भएका घरपरिवारलाई स्वागत छ: परिचयपत्र ल्याउनुहोस् र एक ट्रली खानाका लागि $३० ह्यान्डलिङ शुल्क तिर्नुहोस् (भाउचर वा आपतकालीन खाना दिइँदैन)। तपाईं सामुदायिक कार्यक्रममा मद्दत गर्न वा यो स्थानीय गैर-नाफामूलक संस्थालाई आफ्नो IT सीप दिन पनि सक्नुहुन्छ, र स्वयंसेवकले प्रमाणपत्र पाउन सक्छन्।"
journeyStep3GccWhen: "खाद्य पहुँच: बिहीबार बिहान ९:३० – ११:००; स्वयंसेवा लचिलो (वेबसाइट जाँच गर्नुहोस्)"
journeyStep3GccWhere: "Glenorchy Uniting Church Hall, 21 Kensington Street, Glenorchy (Glenorchy Primary School को पैदल क्रसिङपारि; Entrance चिन्ह पछ्याउनुहोस्)"
journeyStep3GccWho: "स्वयंसेवक: सबै विद्यार्थी (प्रमाणपत्र पाउन सकिन्छ) · खाना: जुनसुकै क्षेत्रका कम आम्दानी भएका घरपरिवार"
journeyStep3GccLink: "gccare.au"
journeyStep3RotaryTitle: "Rotary Clubs of Tasmania"
journeyStep3RotaryText: "Rotary विश्वभरिका सामुदायिक स्वयंसेवकहरूको सञ्जाल हो, र तस्मानियाको District 9830 मा Hobart र Kingston देखि Launceston, Devonport र Burnie सम्म ४२ वटा क्लब छन्। सदस्यहरूले स्थानीय सेवा परियोजना, कोष सङ्कलन र युवा कार्यक्रम चलाउँछन्, र वेबसाइट, IT सहयोग र कार्यक्रममा मद्दत गर्न सक्ने विद्यार्थीलाई स्वागत गर्छन्, साथै स्थानीय व्यावसायिकहरूसँग भेट्ने मौका मिल्छ। उमेर १८–३०? Rotaract युवाहरूका लागि Rotary हो, जसमा सेवा परियोजना, नेतृत्व तालिम र विदेशमा स्वयंसेवा गर्ने मौका छ।"
journeyStep3RotaryWhen: "धेरैजसो क्लब हरेक हप्ता बिहानको खाजा, दिउँसोको खाना वा बेलुकाको खानामा भेटिन्छन्; Rotary Club of Hobart बिहीबार दिउँसो १:०० – २:०० भेटिन्छ"
journeyStep3RotaryWhere: "तस्मानियाभरि ४२ क्लब (पूरा सूची तल); Hobart क्लब Hotel Grand Chancellor, 1 Davey Street मा भेटिन्छ"
