# Homepage — journey
homeJourneyTitle: "你的成长之路，一步一步"
homeJourneyLead: "从抵达塔斯马尼亚到获得第一份ICT工作，共七个实用阶段。按顺序进行，需要时随时回顾任何一步。"

homeStep1Title: "在这里开始新生活"
homeStep1Text: "寻找住宿（合租、寄宿家庭或UTAS宿舍），办理手机和银行账户，熟悉霍巴特交通，采购生活用品。<strong>在VEVO上核对签证条件</strong>（工作时长、出勤、OSHC），并妥善保管入学文件。感到不知所措很正常——先安顿下来，再逐步推进。"
homeStep1Cta: "抵达清单"
homeStep1ImageAlt: "学生们走过UTAS The Forest大楼内的树蕨中庭"

homeStep2Title: "建立你的表达"
homeStep2Text: "若仍需通过英语考试，请将此作为首要目标。参加UTAS附近固定的本地志愿服务，在安全、有结构的环境中练习英语。"
homeStep2Cta: "语言中心 + 志愿服务"
homeStep2ImageAlt: "学生们在kunanyi/惠灵顿山观景台看日出"

homeStep3Title: "融入社区"
homeStep3Text: "错过了开放日？了解UTAS社团、图书馆服务与学生真实项目。记得查看UTAS邮箱和MyLO——重要活动与截止日期都会发布在那里。"
homeStep3Cta: "探索社团与图书馆"
homeStep3ImageAlt: "户外校园节庆活动上的学生与社团摊位"

homeStep4Title: "参加ICT活动"
homeStep4Text: "了解往届活动与即将举行的活动——GDG Hobart、TasICT Festival、企业参观、墨尔本网络安全大会等。"
