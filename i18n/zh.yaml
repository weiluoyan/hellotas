# Journey — Step 2 (build your voice)
journeyStep2Title: "在社区中，找到你的声音"
journeyStep2Lead: "认识新朋友、按自己的节奏练习英语的友好去处。"
journeyStep2ShareLabel: "把这个页面转给还在适应新生活的朋友。"

journeyStep2WhyTitle: "你不需要完美的英语才能开始。你需要的是一个可以安心练习的地方。"
journeyStep2WhyText: "下面的活动免费或花费很低、氛围友好，而且就是为你现在这个阶段设计的。选一个适合你日程的——坚持出现比说得完美更重要。"

journeyStep2WhenLabel: "时间："
journeyStep2WhereLabel: "地点："
journeyStep2LinkLabel: "官方链接"

journeyStep2Section1Title: "会话与社区"
journeyStep2Section3Title: "找到你的圈子"

journeyStep2LingoTitle: "UTAS 语言中心（Language Centre）"
journeyStep2LingoText: "在塔斯马尼亚大学英语语言中心学习英语——Direct Entry / EAP 学位衔接课程，以及面向学习、职业或旅行的通用英语。教师友好，教学设施位于历史建筑 Phillip Smith Centre，社区氛围欢迎你。"
journeyStep2LingoWhen: "接待处周一至周五 9:00 – 16:00 · 开课日期以官网为准"
journeyStep2LingoWhere: "Hobart 校区 Phillip Smith Centre"
journeyStep2LingoImageAlt: "UTAS 英语语言中心所在的历史建筑 Phillip Smith Centre"

