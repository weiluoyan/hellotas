# Homepage — career path (issue #55; replaces habits + homepage graduate stories)
homeCareerTitle: "通往理想职业之路"
homeCareerLead: "这不只是通过考试，而是一步步打下正确的基础。"
homeCareerCard1Title: "打好英语基础"
homeCareerCard1Text: "英语是根基。不必等完美再开始。通过真实对话和本地活动，每天积累。"
homeCareerCard2Title: "融入本地社区"
homeCareerCard2Text: "走出舒适区。了解本地文化，找到共同话题，与当地人建立真诚连接。"
homeCareerCard3Title: "加入社团与 ICT 活动"
homeCareerCard3Text: "把技能用到真实问题解决上。拓展人脉，了解课堂之外行业如何运转。"
homeCareerCard4Title: "积累可靠推荐人"
homeCareerCard4Text: "在澳大利亚，工作机会往往取决于推荐人。你在社团和活动中认识的人，正是会为你背书的人。"
homeCareerCard5Title: "实现你的梦想"
homeCareerCard5Text: "把扎实的英语、本地文化理解、真实经验和可靠推荐结合起来。在塔斯马尼亚取得成功不是运气——而是迈出这些步伐的自然结果。"

