# Journey — 第二步（建立你的声音）
journeyStep2Eyebrow: "成长之路 · 第二步"
journeyStep2Title: "建立你的声音"
journeyStep2Lead: "自信来自持续的、低压力的练习。从那些乐于倾听你的人开始。"

journeyStep2WhyTitle: "你不需要完美的英语才能开始。你需要的是一个可以安心练习的地方。"
journeyStep2WhyText: "下面的活动免费或花费很低、氛围友好，而且就是为你现在这个阶段设计的。选一个适合你日程的——坚持出现比说得完美更重要。"

journeyStep2WhenLabel: "时间："
journeyStep2WhereLabel: "地点："
journeyStep2AddressLabel: "地址"
journeyStep2PhoneLabel: "电话"
journeyStep2EmailLabel: "邮箱"
journeyStep2LinkLabel: "官方链接"

journeyStep2Section1Title: "会话与社区"
journeyStep2Section2Title: "志愿服务与连结"
journeyStep2Section3Title: "找到你的圈子"

journeyStep2LingoTitle: "UTAS Lingo Lounge"
journeyStep2LingoTag: "免费 · 校内"
journeyStep2LingoText: "由国际学生领袖（International Peer Leaders）主持的英语会话活动——他们都是高年级学生，完全理解刚来的头几周是什么感受。欢迎所有口语水平，现场提供免费下午茶。"
journeyStep2LingoWhen: "每学期每周举行——具体日期和教室请在 Uni App 的 “What's On” 里确认"
journeyStep2LingoWhere: "Sandy Bay 校区 Community Lounge 和 Morris Miller 图书馆（学生领袖在 Inveresk 和 Newnham 校区也有活动）"
journeyStep2LingoImageAlt: "学生们在校园里边喝下午茶边练习英语会话"

journeyStep2LibraryTitle: "霍巴特图书馆英语会话小组"
journeyStep2LibraryTag: "免费 · 随时加入"
journeyStep2LibraryText: "公共图书馆里的志愿者带领的会话小组，氛围轻松友好。练习听力和口语，慢慢积累自信——无需预约。"
journeyStep2LibraryWhen: "每周三 10:00 – 12:00（学校学期内）"
journeyStep2LibraryAddress: "Level 1, 91 Murray Street, Hobart TAS 7000"
journeyStep2LibraryPhone: "(03) 6165 5597"
journeyStep2LibraryEmail: "hobartlend.library@libraries.tas.gov.au"
journeyStep2LibraryLink: "libraries.tas.gov.au"
journeyStep2LibraryImageAlt: "成年人在公共图书馆里围坐交谈"
journeyStep2LibraryMapAlt: "标注霍巴特图书馆位置的示意图"

journeyStep2MathersTitle: "Mathers House 社区咖啡与活动"
journeyStep2MathersTag: "低价午餐 · 工作日"
journeyStep2MathersText: "州立图书馆旁的霍巴特市政社区空间。来吃一顿实惠的午餐，留下来参加棋牌、尤克里里等活动，或者加入 Meet & Greet 志愿者帮忙接待访客。"
journeyStep2MathersWhen: "周一至周五，午餐 12:00 – 13:30"
journeyStep2MathersAddress: "108 Bathurst Street, Hobart TAS 7000"
journeyStep2MathersPhone: "03 6234 1441"
journeyStep2MathersEmail: "mathersplace@hobartcity.com.au"
journeyStep2MathersLink: "hobartcity.com.au/Mathers-House"
journeyStep2MathersImageAlt: "老屋里的社区咖啡馆午餐"
journeyStep2MathersMapAlt: "标注 Mathers House 位置的示意图"

journeyStep2RedCrossTitle: "红十字探访志愿者"
journeyStep2RedCrossTag: "志愿"
journeyStep2RedCrossText: "定期探访一位长者，一起喝茶聊天或打打牌。这是练习英语、听本地故事的温柔方式——红十字会提供培训和支持，并承担你的无犯罪证明费用。"
journeyStep2RedCrossWhen: "长期进行，时间迁就你的安排——请先在线申请"
journeyStep2RedCrossAddress: "Red Cross House, 146 Elizabeth Street, Hobart TAS 7000"
journeyStep2RedCrossPhone: "1300 559 992（志愿者报名）"
journeyStep2RedCrossEmail: "agedcarevolunteers@redcross.org.au"
journeyStep2RedCrossLink: "redcross.org.au/agedcarevolunteer"
journeyStep2RedCrossImageAlt: "志愿者与社区长者喝茶聊天"
journeyStep2RedCrossMapAlt: "标注霍巴特红十字会办公室位置的示意图"

journeyStep2PeopleTusaTitle: "TUSA 学生社团"
journeyStep2PeopleTusaImageAlt: "学生在校园社团招新活动上报名"
journeyStep2PeopleTusa1: "100+ 个社团和协会——运动、游戏、文化、摄影"
journeyStep2PeopleTusa2: "20+ 个国际学生社团，常年举办活动"
journeyStep2PeopleTusa3: "UTAS 学生免费入会 — <a href=\"https://tusa.org.au/find-a-club-society/\" target=\"_blank\" rel=\"noopener\">tusa.org.au</a>"

journeyStep2PeopleMrcTitle: "塔斯马尼亚移民资源中心（MRC Tas）"
journeyStep2PeopleMrcImageAlt: "多元文化社区团体欢迎新成员"
journeyStep2PeopleMrc1: "面向移民的社区项目和社交小组——不同项目资格要求不同，直接咨询最方便"
journeyStep2PeopleMrc2: "霍巴特办公室在 Glenorchy · 朗塞斯顿办公室：53 Elizabeth Street"
journeyStep2PeopleMrc3: "(03) 6221 0999 — <a href=\"https://mrctas.org.au/\" target=\"_blank\" rel=\"noopener\">mrctas.org.au</a>"

journeyStep2PeopleLibrariesTitle: "朗塞斯顿及各地区图书馆"
journeyStep2PeopleLibrariesImageAlt: "地区公共图书馆外景"
journeyStep2PeopleLibraries1: "朗塞斯顿图书馆——英语会话课程，致电 (03) 6777 2446"
journeyStep2PeopleLibraries2: "Kingston 图书馆——零基础友好小组，每逢周四"
journeyStep2PeopleLibraries3: "Rosny 图书馆——随到随聊小组，每逢周二"

journeyStep2TipsTitle: "过来人的小建议"
journeyStep2TipsLead: "一位从 UTAS 语言中心起步的中国留学生，靠这些习惯让英语变成了日常。"
journeyStep2Tip1Title: "你的英语比你以为的要好"
journeyStep2Tip1Text: "考试练出来的是读写和听力，口语落后很正常——几乎人人都这样。口语是靠开口次数堆出来的，不是靠再多刷语法。"
journeyStep2Tip2Title: "在微小的瞬间练习"
journeyStep2Tip2Text: "每天多跟咖啡师、公交司机、收银员多说一句话。一个月后你会发现，闲聊不再可怕。"
journeyStep2Tip3Title: "一个固定小组胜过随机聊天"
journeyStep2Tip3Text: "选一个每周固定的小组并坚持去。熟悉的面孔和重复的话题，远比每次见陌生人容易开口。"
journeyStep2Tip4Title: "保留你的圈子，扩展你的声音"
journeyStep2Tip4Text: "通过中文朋友圈子获取活动信息完全没问题——只需约好到了现场就说英语。别担心口音：霍巴特本地人很有耐心，也习惯各种口音。"

journeyStep2NextTitle: "准备好连接你的行业了吗？"
journeyStep2NextText: "等你开口更有自信了，就该去认识 ICT 行业里的人了。"
journeyStep2NextCta: "前往第三步 →"

