journeyStep3FoodHubTitle: "TUSA Food Hub"
journeyStep3FoodHubText: "Food Hub 由塔斯马尼亚大学学生会（TUSA）运营，为各校区的 UTAS 学生提供免费和低价食品。每周在 Rubric 上预约一张票：免费票可领取蔬果、面包、冷冻食品和免费物品桌上的东西；5 澳元或 8 澳元套餐另含 5 件或 8 件食品柜商品。每场都由学生志愿者负责，扫描票券并帮同学找到需要的食品；Food Hub 还会举办免费烹饪课和社区午餐。想帮忙的话，可在 TUSA 志愿者页面报名。"
journeyStep3FoodHubWhen: "Sandy Bay：周二和周四 11:00 – 14:00 · Hobart City：周三 13:00 – 15:00（票于前一周周五 18:00 开放预约）"
