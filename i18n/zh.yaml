journeyStep3GccTitle: "Glenorchy Community Care"
journeyStep3GccText: "由 Glenorchy 教会运营的食品救济中心。每周四上午，志愿者布置教堂礼堂，把捐赠的食品分类摆上桌，再为每户家庭装满一手推车：面包、牛奶、蔬果、肉类和日常食品。欢迎任何地区的低收入家庭：请携带身份证件，支付 30 澳元手续费即可领取一车食品（不发放代金券，也不提供紧急食品）。你也可以协助社区活动，或把你的 IT 技能贡献给这家本地非营利组织，志愿者还可获得相关认证。"
journeyStep3GccWhen: "食品领取：周四 9:30 – 11:00；志愿服务时间灵活（请查看官网）"
journeyStep3GccWhere: "Glenorchy Uniting Church Hall, 21 Kensington Street, Glenorchy（Glenorchy Primary School 人行横道对面；按 Entrance 指示牌进入）"
journeyStep3GccWho: "志愿者：全体学生（可获得认证）· 食品：低收入家庭，欢迎任何地区"
journeyStep3GccLink: "gccare.au"
journeyStep3RotaryTitle: "Rotary Clubs of Tasmania（塔斯马尼亚扶轮社）"
journeyStep3RotaryText: "扶轮社（Rotary）是遍布全球的社区志愿者网络，塔斯马尼亚的 9830 地区共有 42 个俱乐部，从 Hobart、Kingston 到 Launceston、Devonport 和 Burnie。会员开展本地服务项目、筹款活动和青年项目，欢迎能帮忙做网站、IT 支持和活动的学生加入，同时结识本地专业人士。18–30 岁？Rotaract 是面向年轻人的扶轮青年服务团，有服务项目、领导力培训，还有机会去海外做志愿者。"
journeyStep3RotaryWhen: "大多数俱乐部每周聚会一次（早餐、午餐或晚餐）；Rotary Club of Hobart 每周四 13:00 – 14:00"
