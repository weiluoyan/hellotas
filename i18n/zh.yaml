# Journey — Step 2 (build your voice)
journeyStep2Eyebrow: "成长之路 · 第二步"
journeyStep2Title: "建立你的声音"
journeyStep2Lead: "自信来自持续的、低压力的练习。从那些乐于倾听你的人开始。"

journeyStep2WhyTitle: "你不需要完美的英语才能开始。你需要的是一个可以安心练习的地方。"
journeyStep2WhyText: "下面的活动免费或花费很低、氛围友好，而且就是为你现在这个阶段设计的。选一个适合你日程的——坚持出现比说得完美更重要。"

journeyStep2WhenLabel: "时间："
journeyStep2WhereLabel: "地点："
journeyStep2AddressLabel: "地址"
journeyStep2PhoneLabel: "电话"
journeyStep2EmailLabel: "邮箱"
journeyStep2LinkLabel: "官方链接"

journeyStep2Section1Title: "会话与社区"
journeyStep2Section2Title: "志愿服务与连结"
journeyStep2Section3Title: "找到你的圈子"

journeyStep2LingoTitle: "UTAS Language Lounge"
journeyStep2LingoTag: "免费 · 校内"
journeyStep2LingoText: "由国际学生领袖（International Peer Leaders）主持的英语会话活动——他们都是高年级学生，还记得刚来的头几周是什么感受。欢迎所有口语水平。"
journeyStep2LingoWhen: "每学期每周举行——具体日期和教室请在 Uni App 的 “What's On” 里确认"
journeyStep2LingoWhere: "Sandy Bay 校区 Morris Miller 图书馆——具体日期和教室请在 Uni App 的 “What's On” 里确认"
journeyStep2LingoImageAlt: "学生们在校园里边喝下午茶边练习英语会话"

journeyStep2LibraryTitle: "霍巴特图书馆英语会话小组"
journeyStep2LibraryTag: "免费 · 随时加入"
journeyStep2LibraryText: "公共图书馆里的志愿者带领的会话小组，氛围轻松友好。练习听力和口语，慢慢积累自信——无需预约。"
journeyStep2LibraryWhen: "每周三 10:00 – 12:00（学校学期内）"
journeyStep2LibraryAddress: "Level 1, 91 Murray Street, Hobart TAS 7000"
journeyStep2LibraryPhone: "(03) 6165 5597"
journeyStep2LibraryEmail: "hobartlend.library@libraries.tas.gov.au"
journeyStep2LibraryLink: "libraries.tas.gov.au"
journeyStep2LibraryImageAlt: "成年人在公共图书馆里围坐交谈"
journeyStep2LibraryMapAlt: "标注霍巴特图书馆位置的示意图"

journeyStep2MathersTitle: "Mathers House 社区咖啡与活动"
journeyStep2MathersTag: "低价午餐 · 工作日"
journeyStep2MathersText: "州立图书馆旁的霍巴特市政社区空间。来吃一顿实惠的午餐，留下来参加棋牌、尤克里里等活动，或者加入 Meet & Greet 志愿者帮忙接待访客。"
journeyStep2MathersWhen: "周一至周五，午餐 12:00 – 13:30"
journeyStep2MathersAddress: "108 Bathurst Street, Hobart TAS 7000"
journeyStep2MathersPhone: "03 6234 1441"
journeyStep2MathersEmail: "mathersplace@hobartcity.com.au"
journeyStep2MathersLink: "hobartcity.com.au/Mathers-House"
journeyStep2MathersImageAlt: "老屋里的社区咖啡馆午餐"
journeyStep2MathersMapAlt: "标注 Mathers House 位置的示意图"

journeyStep2RedCrossTitle: "红十字探访志愿者"
