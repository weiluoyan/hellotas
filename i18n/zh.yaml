homeHabitsTitle: "尽早养成好习惯"
homeHabitSportsTitle: "让运动成为习惯"
homeHabitSportsText: "每周免费Parkrun、壁球俱乐部、越野跑——塔斯马尼亚拥有世界级的户外运动与室内运动，助你保持健康并在课外结识朋友。"
homeHabitSportsCta: "查看免费运动活动"
homeHabitGrowthTitle: "尽早成为你想成为的人"
homeHabitGrowthText: "把大目标拆成每周小习惯。参加项目、志愿服务、认识新朋友——持续积累比毕业前突击更重要。"
homeHabitGrowthCta: "查看免费成长机会"

