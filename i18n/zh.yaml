# Journey — Step 1 (arrival)
journeyBackToJourney: "← 成长之路"
journeyStep1Eyebrow: "成长之路 · 第一步"
journeyStep1Title: "在这里开始新生活"
journeyStep1Lead: "先解决最基本的生存问题。稳定的基础，是一切可能的开始。"

journeyStep1Priority1Title: "生存收入"
journeyStep1Priority1Tag: "兼职工作"
journeyStep1FirstTitle: "最初两周"
journeyStep1First1Title: "办一张手机卡"
journeyStep1First1Text: "在澳洲，几乎所有事情都需要本地手机号。"
journeyStep1First2Title: "确定住址"
journeyStep1First2Text: "税号（TFN）信件会邮寄到这里。"
journeyStep1First3Title: "开银行账户"
journeyStep1First3Text: "带上护照，也可以先在线申请。"
journeyStep1First4Title: "申请税号（TFN）"
journeyStep1First4Text: "在ATO官网免费在线申请，约2–4周邮寄送达。"
journeyStep1First5Title: "免费坐公交"
journeyStep1First5Text: "Metro公交免费至2027年6月30日，无需办卡。"
journeyStep1First6Title: "开始找工作"
journeyStep1First6Text: "不用等税号下来再投简历。"

journeyStep1Priority1Text: "从落地第一天就开始找工作。"
journeyStep1IncomeResumeTitle: "针对岗位准备简历"
journeyStep1IncomeResumeText: "按工作类型各准备一份：客服、餐饮服务或后厨。之后再寻找与专业相关的工作。"
journeyStep1IncomeApplyTitle: "网申之后再上门"
journeyStep1IncomeApplyText: "先在网上投递，第二天带着同一份简历上门。也可以去咖啡馆、超市和加油站试试。"
journeyStep1IncomeDeliveryTitle: "等待期间先送外卖"
journeyStep1IncomeDeliveryText: "拿到税号后免费申请<a href='https://www.abr.gov.au/business-super-funds-charities/applying-abn' target='_blank' rel='noopener'>ABN</a>，注册DoorDash或Uber Eats。能快速赚钱，但不算工作经验。"
journeyStep1IncomeLinksLabel: "找工作平台："
journeyStep1IncomeWarn1: "<strong>在<a href='https://immi.homeaffairs.gov.au/visas/already-have-a-visa/check-visa-details-and-conditions/check-conditions-online' target='_blank' rel='noopener'>VEVO</a>确认签证的工作时长限制</strong>——送外卖的时间也计算在内。"
journeyStep1IncomeWarn2: "<strong>避免现金工</strong>——通常工资过低、不报税，还可能危及你的签证。<a href='https://www.fairwork.gov.au/tools-and-resources/fact-sheets/rights-and-obligations/international-students' target='_blank' rel='noopener'>了解你的权益 ↗</a>"
journeyStep1Priority1ImageAlt: "塔斯马尼亚大学的学生围坐在咖啡馆风格的厨房餐桌旁"

journeyStep1Priority2Title: "住宿"
journeyStep1Priority2Tag: "安家"
journeyStep1Priority2Text: "尽早确定住处——校园附近的好房间很快就会被租走。"
journeyStep1Priority2ImageAlt: "俯瞰大学附近的 Sandy Bay 住宅区和德文特河"
journeyStep1HomeSearchTitle: "在网上找房"
journeyStep1HomeSearchText: "在 Flatmates 和 Facebook Marketplace 上浏览单间和合租房。来之前就可以开始找。"
journeyStep1HomeGroupsTitle: "加入本地群组"
journeyStep1HomeGroupsText: "加入 Facebook 上的霍巴特租房和合租群组。很多房间只在群里发布。"
journeyStep1HomeAskTitle: "问问其他同学"
journeyStep1HomeAskText: "问问 UTAS 同学住在哪里。他们常常知道自己合租房里哪间房快要空出来。"
journeyStep1HomeLinksLabel: "找房平台："
journeyStep1HomeWarn1: "<strong>先看房再付款</strong>——实地或视频看房。租房骗局常常针对从海外订房的学生。"
journeyStep1HomeWarn2: "<strong>押金通过 MyBond 支付</strong>，不要直接交给房东。<a href='https://www.cbos.tas.gov.au/topics/housing/renting/bonds/paying-bond' target='_blank' rel='noopener'>了解押金规定 ↗</a>"

journeyStep1BasicsTitle: "日常生活基础"

journeyStep1BasicEatTitle: "饮食与采购"
journeyStep1Eat1: "<a href='https://www.coles.com.au/find-stores' target='_blank' rel='noopener'>Coles</a> / <a href='https://www.woolworths.com.au/shop/storelocator' target='_blank' rel='noopener'>Woolworths</a> 超市"
journeyStep1Eat2: "<a href='https://tusa.org.au/food-hub/' target='_blank' rel='noopener'>TUSA Food Hub</a> — 免费水果、蔬菜和面包（带上 UTAS 学生卡）"
journeyStep1Eat3: "North Hobart 的亚洲超市"
journeyStep1EatImageAlt: "学生 Food Hub 里装在木箱中的新鲜水果和蔬菜"

journeyStep1BasicTransportTitle: "出行与交通"
journeyStep1Transport1: "Metro公交<strong>免费至2027年6月30日</strong>——无需办卡"
journeyStep1Transport2: "用 Metro Tasmania 实时App查看公交时间"
journeyStep1Transport3: "来之前学会开车——公交车慢且班次少"
journeyStep1TransportImageAlt: "停在公交站的 Metro Tasmania 公交车"

journeyStep1BasicConnectTitle: "通讯与银行"
journeyStep1Connect1: "预付费手机卡 — Telstra、Optus、Vodafone 或 Amaysim 等平价品牌"
journeyStep1Connect2: "先在线申请 <a href='https://www.commbank.com.au/moving-to-australia/study-in-australia.html' target='_blank' rel='noopener'>CommBank</a> 账户，再带护照去<a href='https://www.commbank.com.au/personal/locate-us/tas/hobart/067000.html' target='_blank' rel='noopener'>霍巴特分行</a>办理"
journeyStep1Connect3: "有稳定收入前先用 prepaid 套餐"
journeyStep1ConnectImageAlt: "围着笔记本电脑微笑的国际学生"

journeyStep1BasicSafetyTitle: "安全第一"
journeyStep1Safety1: "紧急求助：000（警察、消防、救护车）"
journeyStep1Safety2: "UTAS <a href='https://www.utas.edu.au/about/safety-security-and-wellbeing' target='_blank' rel='noopener'>SafeZone App</a> — 校园安保"
journeyStep1Safety3: "非紧急警务求助：131 444"
journeyStep1SafetyImageAlt: "塔斯马尼亚大学 Sandy Bay 校区迎新活动上的学生"

journeyStep1ChecklistTitle: "抵达清单"
journeyStep1ChecklistLead: "全部勾完，就说明你准备好进入第二步了。"
journeyStep1Checklist1: "我已有手机卡、住址和银行账户。"
journeyStep1Checklist2: "我已申请税号（TFN）。"
journeyStep1Checklist3: "简历已准备好，并注册了 Seek、Indeed 和 Jora。"
journeyStep1Checklist4: "我已在VEVO核对工作时长限制。"
journeyStep1Checklist5: "我已有安全的住处（或临时落脚点）。"
journeyStep1Checklist6: "我知道紧急情况该求助谁（000 和校园安保）。"

journeyStep1MissedTitle: "错过了迎新周？"
journeyStep1MissedText: "没关系——很多同学都是晚些才到的。先完成上面的抵达清单，社团、图书馆导览和校园生活可以在第三步补上。"

journeyStep1NextTitle: "准备好进入下一步了吗？"
journeyStep1NextText: "基本生活安顿好之后，就该开始建立说英语的自信了。"
journeyStep1NextCta: "前往第二步 →"
