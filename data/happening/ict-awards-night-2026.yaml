summary:
  en: "The School of ICT's first Awards Night celebrates this year's ICT students, with awards for academic, research and community excellence and the ICT Student's Choice student and staff awards. It also marks the 2026 graduates and their next steps, with a chance to meet staff and industry partners."
  zh: "School of ICT 首届颁奖之夜，表彰今年 ICT 学生的成就：学业、研究和社区卓越奖，以及由学生评选的 ICT Student's Choice 学生奖和教职员奖。当晚也会庆祝 2026 届毕业生迈向下一步，并可结识教职员和行业伙伴。"
  ne: "School of ICT को पहिलो Awards Night ले यस वर्षका ICT विद्यार्थीका उपलब्धि मनाउँछ: शैक्षिक, अनुसन्धान र सामुदायिक उत्कृष्टता पुरस्कार, साथै ICT Student's Choice विद्यार्थी र कर्मचारी पुरस्कार। साँझमा 2026 का स्नातकहरू र उनीहरूको अर्को कदम पनि मनाइन्छ, र कर्मचारी तथा उद्योग साझेदारसँग भेट्ने मौका हुन्छ।"
