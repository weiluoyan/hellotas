baseURL = "https://weiluoyan.github.io/hellotas/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  description = "A step-by-step journey for international ICT students in Tasmania."
  author = "Luoyan Wei"
  defaultTheme = "light"

[params.homeInfoParams]
  Title = "ICT Futures in Tasmania"
  Content = "From Step 1 to the person you want to become."

[languages.en]
  locale = "en-us"
  label = "English"
  title = "ICT Futures in Tasmania"
  weight = 1

[languages.zh]
  locale = "zh-cn"
  label = "简体中文"
  title = "塔斯马尼亚 ICT Futures"
  weight = 2

[languages.ne]
  locale = "ne-np"
  label = "नेपाली"
  title = "ICT Futures in Tasmania"
  weight = 3

# The journey steps live under /journey/ (Kickstart, Community, Volunteering), but the section has no page of its own:
# /journey/ redirects to Kickstart (see content/journey/step-1.md).
[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "{/journey}"
